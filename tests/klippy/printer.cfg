# Test printer for the real-firmware tests of this package (linux process MCU pins).
[mcu]
serial: /tmp/klipper_host_mcu

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000

[heater_bed]
heater_pin: gpiochip0/gpio1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: analog0
control: watermark
min_temp: 0
max_temp: 130

[respond]

[gcode_macro COUNTER]
description: A macro with a variable for the ASSERT_VAR scripts
variable_count: 3
gcode:
  RESPOND MSG="Counter"

[include klippy-support/assert.cfg]
